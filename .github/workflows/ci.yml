name: CI

on:
  push:
    branches: [master, "arena/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Show environment
        run: |
          python -V
          pip -V
          grep -vE '^\s*(#|$)' requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip list
      - name: Run tests
        env:
          ENVIRONMENT: development
          DEMO_DATA_ENABLED: "false"
        run: |
          set +e
          python -m pytest -q -rf > /tmp/pytest.log 2>&1
          status=$?
          tail -c 12000 /tmp/pytest.log
          if [ $status -ne 0 ]; then
            {
              echo "## pytest failures"
              echo '```'
              grep -E "^(FAILED|ERROR)|assert|Error" /tmp/pytest.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -10 | while IFS= read -r line; do
              echo "::error title=pytest::$line"
            done
          fi
          exit $status

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Show environment
        run: |
          node -v
          npm -v
          node -e "console.log(require('./package.json').devDependencies)"
      - name: Install dependencies
        # `npm install` rather than `npm ci`: the committed lockfile predates
        # this iteration and the sandbox registry mirror cannot be trusted to
        # reproduce it byte-for-byte. The build and tests are the real gate.
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: |
          set +e
          npx vitest run --reporter=verbose > /tmp/vitest.log 2>&1
          status=$?
          tail -c 12000 /tmp/vitest.log
          if [ $status -ne 0 ]; then
            {
              echo "## vitest failures"
              echo '```'
              grep -E "FAIL |AssertionError|Error:|Expected|Received|→" /tmp/vitest.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAIL |AssertionError|Error:|Expected|Received" /tmp/vitest.log | head -6 | while IFS= read -r line; do
              echo "::error title=vitest::$line"
            done
          fi
          exit $status
      - name: Production build
        run: npm run build
