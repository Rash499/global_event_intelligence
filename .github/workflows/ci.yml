name: CI

on:
  push:
    branches: [master, "arena/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Show environment
        run: |
          python -V
          pip -V
          grep -vE '^\s*(#|$)' requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip list
      - name: Run tests
        env:
          ENVIRONMENT: development
          DEMO_DATA_ENABLED: "false"
        run: python -m pytest -q -rA

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Show environment
        run: |
          node -v
          npm -v
          node -e "console.log(require('./package.json').devDependencies)"
      - name: Install dependencies
        # `npm install` rather than `npm ci`: the committed lockfile predates
        # this iteration and the sandbox registry mirror cannot be trusted to
        # reproduce it byte-for-byte. The build and tests are the real gate.
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
